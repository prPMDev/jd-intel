name: Test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The library, CLI and test suite have zero dependencies, so there is
      # nothing to install. mcp/ has its own deps, installed below.
      - name: Run tests
        run: node --test test/*.test.js

      # Point mcp's jd-intel dependency at this checkout before installing,
      # so a PR that changes src/ is tested against the MCP server, not the
      # last published jd-intel. Rewriting the range (not committed) also
      # keeps the install working when package.json already names a library
      # version that is not on npm yet, which is the state between a version
      # bump and its publish.
      - name: Install mcp deps against the local library
        if: ${{ !cancelled() }}
        working-directory: mcp
        run: |
          npm pkg set dependencies.jd-intel=file:..
          npm install

      - name: Run mcp tests
        if: ${{ !cancelled() }}
        working-directory: mcp
        run: node --test test/*.test.js
